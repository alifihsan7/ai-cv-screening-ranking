# Leadership taxonomy mapping regex verbs and title patterns (FX-31).

verbs:
  - 'memimpin\s+.*tim'
  - 'led\s+.*team'
  - 'lead\s+.*team'
  - 'mentoring'
  - 'membimbing'
  - '\bketua\b'
  - '\bhead\b'
  - '\bkoordinator\b'

titles:
  - '\blead\b'
  - '\bhead\b'
  - '\bmanager\b'
  - '\bsupervisor\b'

# Teams that are not technical teams. A bullet that leads one of these (and names no technical term) is not
# technical leadership, even inside a technical job (spec 02, 4.2 LEADERSHIP).
non_technical_team_terms:
  - '\bpanitia\b'
  - '\bcommittee\b'
  - '\bacara\b'
  - '\bevents?\b'
  - '\brelokasi\b'
  - '\brelocation\b'
  - '\bkantor\b'
  - '\boffice\b'
  - '\bmarketing\b'
  - '\bpemasaran\b'
  - '\bsales\b'
  - '\bpenjualan\b'
  - '\bgudang\b'
  - '\bwarehouse\b'
  - '\bkonten\b'
  - '\bcontent\b'
  - '\bkasir\b'
  - '\bcashiers?\b'
  - '\bcustomer service\b'
  - '\blayanan pelanggan\b'
  - '\blogistik\b'
  - '\blogistics\b'
  - '\bpengemudi\b'
  - '\bdrivers?\b'

# Words that show a job or a bullet is technical work. Used to keep a verifier from crediting leadership or
# measured results from a job with none of them (marketing, sales, warehouse) for a technical vacancy.
technical_domain_terms:
