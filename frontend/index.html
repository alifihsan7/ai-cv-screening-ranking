<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI CV Screening &amp; Ranking Platform</title>
    <style>
      @keyframes sk-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
      .sk-anim {
        animation: sk-pulse 1.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .sk-block {
        background-color: #E2E9E5;
        border-radius: 6px;
      }
      *, *::before, *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #F2F5F3;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      @media (min-width: 640px) {
        .sk-main-pad { padding: 24px !important; }
        .sk-card-pad { padding: 32px !important; }
      }
      @media (min-width: 1024px) {
        .sk-main-pad { padding: 32px !important; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="sk-anim" style="height: 100vh; width: 100vw; display: flex; flex-direction: column; overflow: hidden; background-color: #F2F5F3;">
        <!-- Topbar Placeholder (44px) -->
        <header style="height: 44px; background-color: #FCFDFC; border-bottom: 1px solid #D5DFD9; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; z-index: 30;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <div style="width: 26px; height: 26px; border-radius: 8px; background-color: #006644; opacity: 0.85; flex-shrink: 0;"></div>
            <div style="width: 120px; height: 16px; border-radius: 4px; background-color: #D5DFD9;"></div>
            <div style="width: 1px; height: 16px; background-color: #D5DFD9;"></div>
            <div style="width: 180px; height: 28px; border-radius: 6px; background-color: #E2E9E5; border: 1px solid #D5DFD9;"></div>
          </div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <div style="width: 84px; height: 26px; border-radius: 6px; background-color: #EBF1EE;"></div>
            <div style="width: 32px; height: 26px; border-radius: 6px; background-color: #EBF1EE;"></div>
          </div>
        </header>

        <!-- Stepper Placeholder (42px) -->
        <div style="height: 42px; background-color: #F7FAF8; border-bottom: 1px solid #D5DFD9; display: flex; align-items: center; justify-content: center; padding: 0 16px; flex-shrink: 0;">
          <div style="height: 32px; max-width: 520px; width: 100%; border-radius: 12px; background-color: #EBF1EE; border: 1px solid rgba(213,223,217,0.6); display: flex; align-items: center; justify-content: space-between; padding: 3px 6px; gap: 6px;">
            <div style="flex: 1; height: 24px; border-radius: 8px; background-color: #E2E9E5;"></div>
            <div style="flex: 1; height: 24px; border-radius: 8px; background-color: #E2E9E5;"></div>
            <div style="flex: 1; height: 24px; border-radius: 8px; background-color: #E2E9E5;"></div>
            <div style="flex: 1; height: 24px; border-radius: 8px; background-color: #E2E9E5;"></div>
          </div>
        </div>

        <!-- Main Body Placeholder -->
        <main style="flex: 1; overflow: hidden; display: flex; flex-direction: column;">
          <div class="sk-main-pad" style="flex: 1; overflow-y: auto; padding: 16px; background-color: #F2F5F3;">
            <div class="sk-card-pad" style="max-width: 56rem; width: 100%; margin: 0 auto; background-color: #FCFDFC; border-radius: 16px; border: 1px solid #D5DFD9; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); padding: 24px; display: flex; flex-direction: column; gap: 24px;">
              <!-- Header Section -->
              <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;">
                <div style="flex: 1;">
                  <div style="width: 80px; height: 16px; border-radius: 4px; background-color: #E2E9E5; margin-bottom: 8px;"></div>
                  <div style="width: 240px; max-width: 70%; height: 24px; border-radius: 6px; background-color: #D5DFD9; margin-bottom: 8px;"></div>
                  <div style="width: 320px; max-width: 90%; height: 14px; border-radius: 4px; background-color: #EBF1EE;"></div>
                </div>
                <div style="width: 120px; height: 28px; border-radius: 8px; background-color: #EBF1EE; flex-shrink: 0;"></div>
              </div>

              <!-- Template Grid -->
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px;">
                <div style="height: 72px; border-radius: 10px; border: 1px solid #D5DFD9; background-color: #F7FAF8; padding: 12px; display: flex; flex-direction: column; justify-content: center; gap: 8px;">
                  <div style="width: 60%; height: 14px; border-radius: 4px; background-color: #E2E9E5;"></div>
                  <div style="width: 85%; height: 10px; border-radius: 3px; background-color: #EBF1EE;"></div>
                </div>
                <div style="height: 72px; border-radius: 10px; border: 1px solid #D5DFD9; background-color: #F7FAF8; padding: 12px; display: flex; flex-direction: column; justify-content: center; gap: 8px;">
                  <div style="width: 55%; height: 14px; border-radius: 4px; background-color: #E2E9E5;"></div>
                  <div style="width: 75%; height: 10px; border-radius: 3px; background-color: #EBF1EE;"></div>
                </div>
                <div style="height: 72px; border-radius: 10px; border: 1px solid #D5DFD9; background-color: #F7FAF8; padding: 12px; display: flex; flex-direction: column; justify-content: center; gap: 8px;">
                  <div style="width: 65%; height: 14px; border-radius: 4px; background-color: #E2E9E5;"></div>
                  <div style="width: 80%; height: 10px; border-radius: 3px; background-color: #EBF1EE;"></div>
                </div>
              </div>

              <!-- Form Inputs -->
              <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
                <div>
                  <div style="width: 90px; height: 12px; border-radius: 3px; background-color: #D5DFD9; margin-bottom: 6px;"></div>
                  <div style="width: 100%; height: 38px; border-radius: 8px; border: 1px solid #D5DFD9; background-color: #F7FAF8;"></div>
                </div>
                <div>
                  <div style="width: 80px; height: 12px; border-radius: 3px; background-color: #D5DFD9; margin-bottom: 6px;"></div>
                  <div style="width: 100%; height: 38px; border-radius: 8px; border: 1px solid #D5DFD9; background-color: #F7FAF8;"></div>
                </div>
                <div>
                  <div style="width: 85px; height: 12px; border-radius: 3px; background-color: #D5DFD9; margin-bottom: 6px;"></div>
                  <div style="width: 100%; height: 38px; border-radius: 8px; border: 1px solid #D5DFD9; background-color: #F7FAF8;"></div>
                </div>
              </div>

              <!-- Textarea Field -->
              <div>
                <div style="width: 140px; height: 12px; border-radius: 3px; background-color: #D5DFD9; margin-bottom: 6px;"></div>
                <div style="width: 100%; height: 140px; border-radius: 8px; border: 1px solid #D5DFD9; background-color: #F7FAF8;"></div>
              </div>

              <!-- Action Buttons -->
              <div style="display: flex; justify-content: flex-end; align-items: center; gap: 12px; padding-top: 8px;">
                <div style="width: 140px; height: 38px; border-radius: 8px; background-color: #E2E9E5;"></div>
                <div style="width: 140px; height: 38px; border-radius: 8px; background-color: #006644; opacity: 0.85;"></div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
